name: Safari Demand Scan

# Weekly. Cadence barely moves cost once postDateLimit is set (you pay for new
# content, not for looking) — the budget guard in scan/budget.mjs is what keeps
# Apify inside its ceiling, not the schedule.
on:
  schedule:
    - cron: "0 11 * * 1"        # Mondays 11:00 UTC = 07:00 ET
  workflow_dispatch:            # run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Scrape and report, but don't classify or write"
        type: boolean
        default: false

concurrency:
  group: safari-scan            # never let two scans race the same budget
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: .github/scan
        run: npm install --no-audit --no-fund

      - name: Verify the Layer 3 scorer
        working-directory: .github/scan
        # The docx's own 10 worked examples + 5 edge cases. If scoring drifts,
        # fail here rather than writing mis-tiered leads to the live feed.
        run: npm run test-scorer

      # The seen-thread ledger stops us re-deep-scraping threads already judged
      # and rejected (192 of 215 on 2026-08-11). Cached, not committed.
      - name: Restore seen-thread ledger
        uses: actions/cache/restore@v4
        with:
          path: .github/scan/seen-threads.json
          key: seen-threads-${{ github.run_id }}
          restore-keys: seen-threads-

      - name: Run scan
        working-directory: .github/scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_MONTHLY_CEILING_USD: ${{ vars.APIFY_MONTHLY_CEILING_USD || '5' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT || 'low' }}
        run: node scan.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save seen-thread ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/scan/seen-threads.json
          key: seen-threads-${{ github.run_id }}
