name: Safari Demand Scan

# MANUAL ONLY (2026-09-09). The weekly cron was removed: it needs a working
# ANTHROPIC_API_KEY for the Layer 1/2 preflight, and with the key revoked every
# firing exited before scraping and told nobody — the feed went ten days stale
# before anyone noticed. A scheduled job that fails silently is worse than none.
#
# It is run by hand from a local checkout instead, via the offline path:
#   node --env-file=.env scrape-only.mjs   -> scraped-posts.json  (spends Apify)
#   Layers 1/2 judged by hand              -> judgments.json
#   node build-pending.mjs                 -> pending-leads.json  (Layer 3)
#   node --env-file=.env import-leads.mjs  -> upsert into Supabase
# Restore the cron line below only once a valid ANTHROPIC_API_KEY is in repo
# secrets AND a failure notification exists.
on:
  # schedule:
  #   - cron: "0 11 * * 1"      # Mondays 11:00 UTC — re-enable with a live key
  workflow_dispatch:            # run it by hand from the Actions tab
    inputs:
      dry_run:
        description: "Scrape and report, but don't classify or write"
        type: boolean
        default: false

concurrency:
  group: safari-scan            # never let two scans race the same budget
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: .github/scan
        run: npm install --no-audit --no-fund

      - name: Verify the Layer 3 scorer
        working-directory: .github/scan
        # The docx's own 10 worked examples + 5 edge cases. If scoring drifts,
        # fail here rather than writing mis-tiered leads to the live feed.
        run: npm run test-scorer

      # The seen-thread ledger stops us re-deep-scraping threads already judged
      # and rejected (192 of 215 on 2026-08-11). Cached, not committed.
      - name: Restore seen-thread ledger
        uses: actions/cache/restore@v4
        with:
          path: .github/scan/seen-threads.json
          key: seen-threads-${{ github.run_id }}
          restore-keys: seen-threads-

      - name: Run scan
        working-directory: .github/scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_MONTHLY_CEILING_USD: ${{ vars.APIFY_MONTHLY_CEILING_USD || '5' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-opus-5' }}
          ANTHROPIC_EFFORT: ${{ vars.ANTHROPIC_EFFORT || 'low' }}
        run: node scan.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save seen-thread ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .github/scan/seen-threads.json
          key: seen-threads-${{ github.run_id }}
